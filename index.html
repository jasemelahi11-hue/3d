<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بنر متحرک سایت</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .banner-container {
            width: 100%;
            max-width: 1100px;
            height: 450px;
            background: linear-gradient(135deg, #e0e0e0 0%, #fdfdfd 100%);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            overflow: hidden;
            position: relative;
        }

        .banner-content {
            flex: 1;
            z-index: 2;
        }

        .banner-content h1 {
            font-size: 38px;
            color: #222;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .banner-content p {
            font-size: 18px;
            color: #555;
            margin-bottom: 25px;
        }

        .banner-btn {
            background: linear-gradient(135deg, #111 0%, #333 100%);
            color: #fff;
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-decoration: none;
            display: inline-block;
        }

        .banner-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            background: linear-gradient(135deg, #333 0%, #000 100%);
        }

        .banner-image-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .banner-3d-img {
            width: 350px;
            border-radius: 15px;
            animation: float3D 4s ease-in-out infinite;
            filter: drop-shadow(0 25px 25px rgba(0,0,0,0.2));
            transform-style: preserve-3d;
        }

        @keyframes float3D {
            0% {
                transform: translateY(0px) rotateY(0deg) rotateX(0deg);
            }
            50% {
                transform: translateY(-15px) rotateY(5deg) rotateX(3deg);
            }
            100% {
                transform: translateY(0px) rotateY(0deg) rotateX(0deg);
            }
        }

        @media (max-width: 768px) {
            .banner-container {
                flex-direction: column-reverse;
                height: auto;
                padding: 30px 20px;
                text-align: center;
            }
            .banner-content h1 {
                font-size: 26px;
            }
            .banner-3d-img {
                width: 260px;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="banner-container">
        <div class="banner-content">
            <h1>استایل خاص،<br>کیفیت ماندگار</h1>
            <p>پیراهن‌های بافتی و طرح‌دار جدید - کلکسیون ویژه</p>
            <a href="#" class="banner-btn">خرید آنلاین</a>
        </div>

        <div class="banner-image-wrapper">
            <!-- نام عکس شما به طور دقیق اینجا تنظیم شده است -->
            <img src="1789589134642.png" alt="پیراهن مردانه" class="banner-3d-img">
        </div>
    </div>

</body>
</html>
